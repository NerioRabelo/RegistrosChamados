<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Chamados e Ordens de Serviço</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        color: #222;
    }

    header {
        background: #17365d;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
        margin-top: 0;
        color: #17365d;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .campo {
        display: flex;
        flex-direction: column;
    }

    .campo.full {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 6px;
    }

    input, textarea, select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        background-color: #fff;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .botoes {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: opacity 0.2s;
    }

    button:hover {
        opacity: 0.9;
    }

    .salvar {
        background: #198754;
        color: white;
    }

    .limpar {
        background: #6c757d;
        color: white;
    }

    .editar {
        background: #ffc107;
        color: #222;
    }

    .excluir {
        background: #dc3545;
        color: white;
    }

    .imprimir {
        background: #0d6efd;
        color: white;
    }

    .pesquisa {
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        vertical-align: middle;
    }

    th {
        background: #17365d;
        color: white;
    }

    .acoes {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
    }

    /* Estilos para os Badges de Status */
    .status-badge {
        padding: 5px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        display: inline-block;
        text-align: center;
        white-space: nowrap;
    }
    
    .status-em-atendimento {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
    }
    
    .status-resolvido {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .status-fechado {
        background: #e2e3e5;
        color: #383d41;
        border: 1px solid #d6d8db;
    }

    /* Estilos do Modal Customizado */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: white;
        padding: 25px;
        border-radius: 8px;
        min-width: 300px;
        max-width: 90%;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    @media(max-width: 700px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .campo.full {
            grid-column: auto;
        }

        table {
            font-size: 13px;
        }
        
        th, td {
            padding: 8px 5px;
        }
    }

    @media print {
        body * {
            visibility: hidden;
        }

        #impressao, #impressao * {
            visibility: visible;
        }

        #impressao {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            padding: 30px;
        }

        .nao-imprimir {
            display: none !important;
        }
    }
</style>
</head>

<body>

<header class="nao-imprimir">
    <h1>Sistema de Chamados e Ordens de Serviço</h1>
    <p>Digitalização de manutenção local</p>
</header>

<div class="container nao-imprimir">

    <div class="card">
        <h2>Cadastro do Chamado</h2>

        <form id="formulario" novalidate>

            <div class="grid">

                <div class="campo">
                    <label for="chamado">Nº do chamado *</label>
                    <input type="text" id="chamado" required>
                </div>

                <div class="campo">
                    <label for="os">Ordem de serviço</label>
                    <input type="text" id="os">
                </div>

                <div class="campo">
                    <label for="solicitante">Solicitante *</label>
                    <input type="text" id="solicitante" required>
                </div>

                <div class="campo">
                    <label for="setor">Setor</label>
                    <input type="text" id="setor">
                </div>

                <div class="campo">
                    <label for="bloco">Bloco</label>
                    <input type="text" id="bloco">
                </div>

                <div class="campo">
                    <label for="local">Local</label>
                    <input type="text" id="local">
                </div>

                <div class="campo full">
                    <label for="item">Item descritivo</label>
                    <input type="text" id="item">
                </div>

                <div class="campo full">
                    <label for="aparelho">Descrição do aparelho</label>
                    <textarea id="aparelho"></textarea>
                </div>

                <div class="campo">
                    <label for="evaporadora">Evaporadora</label>
                    <input type="text" id="evaporadora">
                </div>

                <div class="campo">
                    <label for="condensadora">Condensadora</label>
                    <input type="text" id="condensadora">
                </div>

                <div class="campo full">
                    <label for="defeito">Defeito relatado</label>
                    <textarea id="defeito"></textarea>
                </div>

                <div class="campo full">
                    <label for="solucao">Solução do defeito</label>
                    <textarea id="solucao"></textarea>
                </div>

                <div class="campo">
                    <label for="data">Data *</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label for="status">Status *</label>
                    <select id="status" required>
                        <option value="Em atendimento">Em atendimento</option>
                        <option value="Resolvido">Resolvido</option>
                        <option value="Fechado">Fechado</option>
                    </select>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" id="btn-salvar" class="salvar">
                    Salvar chamado
                </button>

                <button type="button" class="limpar" onclick="limparFormulario()">
                    Limpar
                </button>
            </div>

        </form>
    </div>

    <div class="card">
        <h2>Chamados cadastrados</h2>

        <input
            class="pesquisa"
            type="text"
            id="pesquisa"
            placeholder="Pesquisar por chamado, solicitante, setor ou local..."
            onkeyup="listarChamados()"
        >

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Chamado</th>
                        <th>OS</th>
                        <th>Solicitante</th>
                        <th>Setor</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Elemento para impressão -->
<div id="impressao"></div>

<!-- Modal Personalizado -->
<div id="custom-modal" class="modal-overlay nao-imprimir">
    <div class="modal-content">
        <h3 id="modal-title" style="margin-top: 0; color: #17365d;">Aviso</h3>
        <p id="modal-message"></p>
        <div class="modal-buttons">
            <button id="modal-btn-cancel" class="limpar" style="display: none;">Cancelar</button>
            <button id="modal-btn-confirm" class="salvar">OK</button>
        </div>
    </div>
</div>

<script>
let chamados = JSON.parse(localStorage.getItem("chamados")) || [];
let editandoIndex = null;

const formulario = document.getElementById("formulario");
const inputChamado = document.getElementById("chamado");
const inputPesquisa = document.getElementById("pesquisa");

// --- Sistema de Modal Customizado ---
let modalConfirmCallback = null;

function showAlert(message) {
    document.getElementById("modal-title").innerText = "Aviso";
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-btn-cancel").style.display = "none";
    document.getElementById("custom-modal").style.display = "flex";
    modalConfirmCallback = null;
}

function showConfirm(message, callback) {
    document.getElementById("modal-title").innerText = "Confirmação";
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-btn-cancel").style.display = "inline-block";
    document.getElementById("custom-modal").style.display = "flex";
    modalConfirmCallback = callback;
}

document.getElementById("modal-btn-confirm").addEventListener("click", () => {
    document.getElementById("custom-modal").style.display = "none";
    if (modalConfirmCallback) modalConfirmCallback();
});

document.getElementById("modal-btn-cancel").addEventListener("click", () => {
    document.getElementById("custom-modal").style.display = "none";
    modalConfirmCallback = null;
});
// ------------------------------------

function validarCampoTexto(idCampo, nomeExibicao) {
    const el = document.getElementById(idCampo);
    const valor = el ? el.value.trim() : "";
    if (!valor) {
        showAlert(`O campo "${nomeExibicao}" é obrigatório.`);
        if (el) el.focus();
        return false;
    }
    return true;
}

function validarFormulario() {
    if (!validarCampoTexto("chamado", "Nº do chamado")) return false;
    if (!validarCampoTexto("solicitante", "Solicitante")) return false;
    if (!validarCampoTexto("data", "Data")) return false;
    
    const numChamado = inputChamado.value.trim();
    // Verifica duplicidade exceto se estiver editando o próprio registro atual
    const existe = chamados.some((ch, index) => ch.chamado === numChamado && index !== editandoIndex);
    
    if (existe) {
        showAlert(`Já existe um chamado cadastrado com o número ${numChamado}.`);
        inputChamado.focus();
        return false;
    }
    return true;
}

function formatarDataBR(dataString) {
    if (!dataString) return "";
    const partes = dataString.split("-");
    if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataString;
}

function obterClasseStatus(status) {
    if (status === "Em atendimento") return "status-em-atendimento";
    if (status === "Resolvido") return "status-resolvido";
    if (status === "Fechado") return "status-fechado";
    return "";
}

formulario.addEventListener("submit", function(event) {
    event.preventDefault();
    if (!validarFormulario()) return;

    const registro = {
        chamado: document.getElementById("chamado").value.trim(),
        os: document.getElementById("os").value.trim(),
        solicitante: document.getElementById("solicitante").value.trim(),
        setor: document.getElementById("setor").value.trim(),
        bloco: document.getElementById("bloco").value.trim(),
        local: document.getElementById("local").value.trim(),
        item: document.getElementById("item").value.trim(),
        aparelho: document.getElementById("aparelho").value.trim(),
        evaporadora: document.getElementById("evaporadora").value.trim(),
        condensadora: document.getElementById("condensadora").value.trim(),
        defeito: document.getElementById("defeito").value.trim(),
        solucao: document.getElementById("solucao").value.trim(),
        data: document.getElementById("data").value,
        status: document.getElementById("status").value
    };

    if (editandoIndex !== null) {
        chamados[editandoIndex] = registro;
        showAlert("Chamado atualizado com sucesso!");
    } else {
        chamados.push(registro);
        showAlert("Chamado salvo com sucesso!");
    }

    localStorage.setItem("chamados", JSON.stringify(chamados));
    limparFormulario();
    listarChamados();
});

function listarChamados() {
    const lista = document.getElementById("lista");
    const pesquisa = inputPesquisa.value.toLowerCase();
    lista.innerHTML = "";

    chamados.forEach((item, index) => {
        const statusAtual = item.status || "Em atendimento"; 
        const texto = `
            ${item.chamado}
            ${item.solicitante}
            ${item.setor}
            ${item.local}
            ${statusAtual}
        `.toLowerCase();

        if (!texto.includes(pesquisa)) return;

        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${item.chamado}</td>
            <td>${item.os}</td>
            <td>${item.solicitante}</td>
            <td>${item.setor}</td>
            <td>${item.local}</td>
            <td>${formatarDataBR(item.data)}</td>
            <td>
                <span class="status-badge ${obterClasseStatus(statusAtual)}">
                    ${statusAtual}
                </span>
            </td>
            <td>
                <div class="acoes">
                    <button class="editar" onclick="editarChamado(${index})">Editar</button>
                    <button class="excluir" onclick="excluirChamado(${index})">Excluir</button>
                    <button class="imprimir" onclick="imprimirChamado(${index})">Imprimir</button>
                </div>
            </td>
        `;
        lista.appendChild(linha);
    });
}

function editarChamado(index) {
    const item = chamados[index];
    if(!item) return;

    document.getElementById("chamado").value = item.chamado;
    document.getElementById("os").value = item.os;
    document.getElementById("solicitante").value = item.solicitante;
    document.getElementById("setor").value = item.setor;
    document.getElementById("bloco").value = item.bloco;
    document.getElementById("local").value = item.local;
    document.getElementById("item").value = item.item;
    document.getElementById("aparelho").value = item.aparelho || "";
    document.getElementById("evaporadora").value = item.evaporadora || "";
    document.getElementById("condensadora").value = item.condensadora || "";
    document.getElementById("defeito").value = item.defeito || "";
    document.getElementById("solucao").value = item.solucao || "";
    document.getElementById("data").value = item.data;
    document.getElementById("status").value = item.status || "Em atendimento";

    editandoIndex = index; 
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function excluirChamado(index) {
    showConfirm("Deseja realmente excluir este chamado?", () => {
        chamados.splice(index, 1);
        localStorage.setItem("chamados", JSON.stringify(chamados));
        listarChamados();
        showAlert("Chamado excluído com sucesso!");
    });
}

function limparFormulario() {
    formulario.reset();
    editandoIndex = null;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
    document.getElementById("status").value = "Em atendimento";
}

function imprimirChamado(index) {
    const item = chamados[index];
    if(!item) return;

    const statusAtual = item.status || "Em atendimento";

    document.getElementById("impressao").innerHTML = `
        <h1>ORDEM DE SERVIÇO</h1>
        <hr>
        <h3>Identificação</h3>
        <p><strong>Nº do chamado:</strong> ${item.chamado}</p>
        <p><strong>Ordem de serviço:</strong> ${item.os}</p>
        <p><strong>Data:</strong> ${formatarDataBR(item.data)}</p>
        <p><strong>Status Atual:</strong> ${statusAtual}</p>
        
        <h3>Solicitação</h3>
        <p><strong>Solicitante:</strong> ${item.solicitante}</p>
        <p><strong>Setor:</strong> ${item.setor}</p>
        <p><strong>Bloco:</strong> ${item.bloco}</p>
        <p><strong>Local:</strong> ${item.local}</p>
        <p><strong>Item descritivo:</strong> ${item.item}</p>
        
        <h3>Equipamento</h3>
        <p><strong>Descrição do aparelho:</strong><br>${item.aparelho || "Não informado"}</p>
        <p><strong>Evaporadora:</strong> ${item.evaporadora || "Não informado"}</p>
        <p><strong>Condensadora:</strong> ${item.condensadora || "Não informado"}</p>
        
        <h3>Manutenção</h3>
        <p><strong>Defeito relatado:</strong><br>${item.defeito || "Não informado"}</p>
        <p><strong>Solução do defeito:</strong><br>${item.solucao || "Não informado"}</p>
        <br><br>
        <p>________________________________________</p>
        <p>Responsável pela execução</p>
        <br>
        <p>________________________________________</p>
        <p>Responsável pelo recebimento</p>
    `;

    window.print();
}

// Inicializa a tabela e limpa o form ao carregar
limparFormulario();
listarChamados();

</script>
</body>
</html>
