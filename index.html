<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Chamados e Ordens de Serviço</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        color: #222;
    }

    header {
        background: #17365d;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
        margin-top: 0;
        color: #17365d;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .campo {
        display: flex;
        flex-direction: column;
    }

    .campo.full {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 6px;
    }

    input, textarea, select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .botoes {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .salvar {
        background: #198754;
        color: white;
    }

    .limpar {
        background: #6c757d;
        color: white;
    }

    .editar {
        background: #ffc107;
        color: #222;
    }

    .excluir {
        background: #dc3545;
        color: white;
    }

    .imprimir {
        background: #0d6efd;
        color: white;
    }

    .pesquisa {
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #17365d;
        color: white;
    }

    .acoes {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
    }

    @media(max-width: 700px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .campo.full {
            grid-column: auto;
        }

        table {
            font-size: 13px;
        }
    }

    @media print {
        body * {
            visibility: hidden;
        }

        #impressao, #impressao * {
            visibility: visible;
        }

        #impressao {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            padding: 30px;
        }

        .nao-imprimir {
            display: none !important;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Sistema de Chamados e Ordens de Serviço</h1>
    <p>Digitalização de manutenção</p>
</header>

<div class="container">

    <div class="card">
        <h2>Cadastro do Chamado</h2>

        <form id="formulario" novalidate>

            <div class="grid">

                <div class="campo">
                    <label for="chamado">Nº do chamado *</label>
                    <input type="text" id="chamado" required>
                </div>

                <div class="campo">
                    <label for="os">Ordem de serviço</label>
                    <input type="text" id="os">
                </div>

                <div class="campo">
                    <label for="solicitante">Solicitante *</label>
                    <input type="text" id="solicitante" required>
                </div>

                <div class="campo">
                    <label for="setor">Setor</label>
                    <input type="text" id="setor">
                </div>

                <div class="campo">
                    <label for="bloco">Bloco</label>
                    <input type="text" id="bloco">
                </div>

                <div class="campo">
                    <label for="local">Local</label>
                    <input type="text" id="local">
                </div>

                <div class="campo full">
                    <label for="item">Item descritivo</label>
                    <input type="text" id="item">
                </div>

                <div class="campo full">
                    <label for="aparelho">Descrição do aparelho</label>
                    <textarea id="aparelho"></textarea>
                </div>

                <div class="campo">
                    <label for="evaporadora">Evaporadora</label>
                    <input type="text" id="evaporadora">
                </div>

                <div class="campo">
                    <label for="condensadora">Condensadora</label>
                    <input type="text" id="condensadora">
                </div>

                <div class="campo full">
                    <label for="defeito">Defeito relatado</label>
                    <textarea id="defeito"></textarea>
                </div>

                <div class="campo full">
                    <label for="solucao">Solução do defeito</label>
                    <textarea id="solucao"></textarea>
                </div>

                <div class="campo">
                    <label for="data">Data *</label>
                    <input type="date" id="data" required>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" class="salvar">
                    Salvar chamado
                </button>

                <button type="button" class="limpar" onclick="limparFormulario()">
                    Limpar
                </button>
            </div>

        </form>
    </div>

    <div class="card nao-imprimir">
        <h2>Chamados cadastrados</h2>

        <input
            class="pesquisa"
            type="text"
            id="pesquisa"
            placeholder="Pesquisar por chamado, solicitante, setor ou local..."
            onkeyup="listarChamados()"
        >

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Chamado</th>
                        <th>OS</th>
                        <th>Solicitante</th>
                        <th>Setor</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>

    <div id="impressao"></div>

</div>

<script>

let chamados = JSON.parse(localStorage.getItem("chamados")) || [];
let editando = null;

const formulario = document.getElementById("formulario");

// Funções Auxiliares de Validação

function validarCampoTexto(idCampo, nomeExibicao) {
    const el = document.getElementById(idCampo);
    const valor = el ? el.value.trim() : "";
    if (!valor) {
        alert(`O campo "${nomeExibicao}" é obrigatório e não pode conter apenas espaços.`);
        if (el) el.focus();
        return false;
    }
    return true;
}

function validarFormulario() {
    if (!validarCampoTexto("chamado", "Nº do chamado")) return false;
    if (!validarCampoTexto("solicitante", "Solicitante")) return false;
    if (!validarCampoTexto("data", "Data")) return false;
    return true;
}

function formatarDataBR(dataString) {
    if (!dataString) return "";
    const partes = dataString.split("-");
    if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataString;
}

// Submissão do Formulário

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    if (!validarFormulario()) {
        return;
    }

    const registro = {
        chamado: document.getElementById("chamado").value.trim(),
        os: document.getElementById("os").value.trim(),
        solicitante: document.getElementById("solicitante").value.trim(),
        setor: document.getElementById("setor").value.trim(),
        bloco: document.getElementById("bloco").value.trim(),
        local: document.getElementById("local").value.trim(),
        item: document.getElementById("item").value.trim(),
        aparelho: document.getElementById("aparelho").value.trim(),
        evaporadora: document.getElementById("evaporadora").value.trim(),
        condensadora: document.getElementById("condensadora").value.trim(),
        defeito: document.getElementById("defeito").value.trim(),
        solucao: document.getElementById("solucao").value.trim(),
        data: document.getElementById("data").value
    };

    if (editando !== null) {
        chamados[editando] = registro;
        editando = null;
    } else {
        chamados.push(registro);
    }

    localStorage.setItem("chamados", JSON.stringify(chamados));

    limparFormulario();
    listarChamados();

    alert("Chamado salvo com sucesso!");
});

function listarChamados() {
    const lista = document.getElementById("lista");
    const pesquisa = document.getElementById("pesquisa").value.toLowerCase();

    lista.innerHTML = "";

    chamados.forEach((item, index) => {

        const texto = `
            ${item.chamado}
            ${item.solicitante}
            ${item.setor}
            ${item.local}
        `.toLowerCase();

        if (!texto.includes(pesquisa)) return;

        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${item.chamado}</td>
            <td>${item.os}</td>
            <td>${item.solicitante}</td>
            <td>${item.setor}</td>
            <td>${item.local}</td>
            <td>${formatarDataBR(item.data)}</td>

            <td>
                <div class="acoes">
                    <button class="editar" onclick="editarChamado(${index})">
                        Editar
                    </button>

                    <button class="excluir" onclick="excluirChamado(${index})">
                        Excluir
                    </button>

                    <button class="imprimir" onclick="imprimirChamado(${index})">
                        Imprimir
                    </button>
                </div>
            </td>
        `;

        lista.appendChild(linha);
    });
}

function editarChamado(index) {
    const item = chamados[index];

    document.getElementById("chamado").value = item.chamado;
    document.getElementById("os").value = item.os;
    document.getElementById("solicitante").value = item.solicitante;
    document.getElementById("setor").value = item.setor;
    document.getElementById("bloco").value = item.bloco;
    document.getElementById("local").value = item.local;
    document.getElementById("item").value = item.item;
    document.getElementById("aparelho").value = item.aparelho;
    document.getElementById("evaporadora").value = item.evaporadora;
    document.getElementById("condensadora").value = item.condensadora;
    document.getElementById("defeito").value = item.defeito;
    document.getElementById("solucao").value = item.solucao;
    document.getElementById("data").value = item.data;

    editando = index;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function excluirChamado(index) {
    if (confirm("Deseja realmente excluir este chamado?")) {
        chamados.splice(index, 1);
        localStorage.setItem("chamados", JSON.stringify(chamados));
        listarChamados();
    }
}

function limparFormulario() {
    formulario.reset();
    editando = null;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
}

function imprimirChamado(index) {
    const item = chamados[index];

    document.getElementById("impressao").innerHTML = `
        <h1>ORDEM DE SERVIÇO</h1>
        <hr>

        <h3>Identificação</h3>
        <p><strong>Nº do chamado:</strong> ${item.chamado}</p>
        <p><strong>Ordem de serviço:</strong> ${item.os}</p>
        <p><strong>Data:</strong> ${formatarDataBR(item.data)}</p>

        <h3>Solicitação</h3>
        <p><strong>Solicitante:</strong> ${item.solicitante}</p>
        <p><strong>Setor:</strong> ${item.setor}</p>
        <p><strong>Bloco:</strong> ${item.bloco}</p>
        <p><strong>Local:</strong> ${item.local}</p>
        <p><strong>Item descritivo:</strong> ${item.item}</p>

        <h3>Equipamento</h3>
        <p><strong>Descrição do aparelho:</strong><br>${item.aparelho}</p>
        <p><strong>Evaporadora:</strong> ${item.evaporadora}</p>
        <p><strong>Condensadora:</strong> ${item.condensadora}</p>

        <h3>Manutenção</h3>
        <p><strong>Defeito relatado:</strong><br>${item.defeito}</p>
        <p><strong>Solução do defeito:</strong><br>${item.solucao}</p>

        <br><br>
        <p>________________________________________</p>
        <p>Responsável pela execução</p>
        <br>
        <p>________________________________________</p>
        <p>Responsável pelo recebimento</p>
    `;

    window.print();
}

limparFormulario();
listarChamados();

</script>

</body>
</html>
