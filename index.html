<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados e Ordens de Serviço</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #17365d;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .btn-relatorio {
            position: absolute;
            right: 20px;
            top: 25px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        h2 {
            margin-top: 0;
            color: #17365d;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .botoes {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .salvar {
            background: #198754;
            color: white;
        }

        .limpar {
            background: #6c757d;
            color: white;
        }

        @media(max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .campo.full {
                grid-column: auto;
            }

            .btn-relatorio {
                position: static;
                display: inline-block;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Sistema de Chamados e Ordens de Serviço</h1>
        <p>Digitalização de manutenção</p>
        <a href="relatorio.html" class="btn-relatorio">Ver Todos os Chamados</a>
    </header>

    <div class="container">
        <div class="card">
            <h2>Cadastro do Chamado</h2>
            <form id="formulario" novalidate>
                <div class="grid">
                    <div class="campo">
                        <label for="chamado">Nº do chamado *</label>
                        <input type="number" id="chamado" required
                            onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                    <div class="campo">
                        <label for="os">Ordem de serviço</label>
                        <input type="text" id="os">
                    </div>
                    <div class="campo">
                        <label for="solicitante">Solicitante *</label>
                        <input type="text" id="solicitante" required>
                    </div>
                    <div class="campo">
                        <label for="setor">Setor</label>
                        <input type="text" id="setor">
                    </div>
                    <div class="campo">
                        <label for="bloco">Bloco</label>
                        <input type="text" id="bloco">
                    </div>
                    <div class="campo">
                        <label for="local">Local</label>
                        <input type="text" id="local">
                    </div>
                    <div class="campo full">
                        <label for="item">Item descritivo</label>
                        <input type="number" id="item" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                    <div class="campo full">
                        <label for="aparelho">Descrição do aparelho</label>
                        <textarea id="aparelho"></textarea>
                    </div>
                    <div class="campo">
                        <label for="evaporadora">Evaporadora</label>
                        <input type="number" id="evaporadora"
                            onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                    <div class="campo">
                        <label for="condensadora">Condensadora</label>
                        <input type="number" id="condensadora"
                            onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                    <div class="campo full">
                        <label for="defeito">Defeito relatado</label>
                        <textarea id="defeito"></textarea>
                    </div>
                    <div class="campo full">
                        <label for="solucao">Solução do defeito</label>
                        <textarea id="solucao"></textarea>
                    </div>
                    <div class="campo">
                        <label for="data">Data *</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="campo">
                        <label for="status">Status do chamado *</label>
                        <select id="status" required>
                            <option value="Em atendimento">Em atendimento</option>
                            <option value="Resolvido">Resolvido</option>
                            <option value="Fechado">Fechado</option>
                        </select>
                    </div>
                </div>
                <div class="botoes">
                    <button type="submit" class="salvar">Salvar chamado</button>
                    <button type="button" class="limpar" onclick="limparFormulario()">Limpar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SDKs do Firebase (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLE A SUA CONFIGURAÇÃO DO FIREBASE AQUI:
        const firebaseConfig = {
            apiKey: "AIzaSyCgPCSSwzr59QFRI6zgen6eQr9eHfLEnnQ",
            authDomain: "registroschamados-ae4b3.firebaseapp.com",
            projectId: "registroschamados-ae4b3",
            storageBucket: "registroschamados-ae4b3.firebasestorage.app",
            messagingSenderId: "572947617370",
            appId: "1:572947617370:web:0f6b50855af37911f8aa63"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const editandoId = urlParams.get("editar");
        const formulario = document.getElementById("formulario");

        // Se estiver editando, busca o registro no Firestore
        async function carregarDadosEdicao() {
            if (editandoId) {
                const docRef = doc(db, "chamados", editandoId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const item = docSnap.data();
                    document.getElementById("chamado").value = item.chamado;
                    document.getElementById("os").value = item.os;
                    document.getElementById("solicitante").value = item.solicitante;
                    document.getElementById("setor").value = item.setor;
                    document.getElementById("bloco").value = item.bloco;
                    document.getElementById("local").value = item.local;
                    document.getElementById("item").value = item.item;
                    document.getElementById("aparelho").value = item.aparelho;
                    document.getElementById("evaporadora").value = item.evaporadora;
                    document.getElementById("condensadora").value = item.condensadora;
                    document.getElementById("defeito").value = item.defeito;
                    document.getElementById("solucao").value = item.solucao;
                    document.getElementById("data").value = item.data;
                    document.getElementById("status").value = item.status || "Em atendimento";
                }
            } else {
                document.getElementById("data").value = new Date().toISOString().split("T")[0];
            }
        }
        carregarDadosEdicao();

        function validarCampoTexto(idCampo, nomeExibicao) {
            const el = document.getElementById(idCampo);
            const valor = el ? el.value.trim() : "";
            if (!valor) {
                alert(`O campo "${nomeExibicao}" é obrigatório e não pode conter apenas espaços.`);
                if (el) el.focus();
                return false;
            }
            return true;
        }

        function validarFormulario() {
            if (!validarCampoTexto("chamado", "Nº do chamado")) return false;
            if (!validarCampoTexto("solicitante", "Solicitante")) return false;
            if (!validarCampoTexto("data", "Data")) return false;
            if (!validarCampoTexto("status", "Status do chamado")) return false;
            return true;
        }

        formulario.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (!validarFormulario()) return;

            const registro = {
                chamado: document.getElementById("chamado").value.trim(),
                os: document.getElementById("os").value.trim(),
                solicitante: document.getElementById("solicitante").value.trim(),
                setor: document.getElementById("setor").value.trim(),
                bloco: document.getElementById("bloco").value.trim(),
                local: document.getElementById("local").value.trim(),
                item: document.getElementById("item").value.trim(),
                aparelho: document.getElementById("aparelho").value.trim(),
                evaporadora: document.getElementById("evaporadora").value.trim(),
                condensadora: document.getElementById("condensadora").value.trim(),
                defeito: document.getElementById("defeito").value.trim(),
                solucao: document.getElementById("solucao").value.trim(),
                data: document.getElementById("data").value,
                status: document.getElementById("status").value
            };

            try {
                if (editandoId) {
                    const docRef = doc(db, "chamados", editandoId);
                    await updateDoc(docRef, registro);
                    alert("Chamado atualizado com sucesso!");
                } else {
                    await addDoc(collection(db, "chamados"), registro);
                    alert("Chamado salvo com sucesso!");
                }
                window.location.href = "relatorio.html";
            } catch (e) {
                console.error("Erro ao salvar: ", e);
                alert("Erro ao salvar o chamado.");
            }
        });

        window.limparFormulario = function () {
            formulario.reset();
            document.getElementById("data").value = new Date().toISOString().split("T")[0];
            document.getElementById("status").value = "Em atendimento";
        }
    </script>

</body>

</html>
