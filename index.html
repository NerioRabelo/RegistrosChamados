<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Chamados e Ordens de Serviço</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        color: #222;
    }

    header {
        background: #17365d;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
        margin-top: 0;
        color: #17365d;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .campo {
        display: flex;
        flex-direction: column;
    }

    .campo.full {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 6px;
    }

    input, textarea, select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        background-color: #fff;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .botoes {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: opacity 0.2s;
    }

    button:hover {
        opacity: 0.9;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .salvar {
        background: #198754;
        color: white;
    }

    .limpar {
        background: #6c757d;
        color: white;
    }

    .editar {
        background: #ffc107;
        color: #222;
    }

    .excluir {
        background: #dc3545;
        color: white;
    }

    .imprimir {
        background: #0d6efd;
        color: white;
    }

    .pesquisa {
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        vertical-align: middle;
    }

    th {
        background: #17365d;
        color: white;
    }

    .acoes {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
    }

    /* Estilos para os Badges de Status */
    .status-badge {
        padding: 5px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        display: inline-block;
        text-align: center;
        white-space: nowrap;
    }
    
    .status-em-atendimento {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
    }
    
    .status-resolvido {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .status-fechado {
        background: #e2e3e5;
        color: #383d41;
        border: 1px solid #d6d8db;
    }

    /* Estilos do Modal Customizado */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: white;
        padding: 25px;
        border-radius: 8px;
        min-width: 300px;
        max-width: 90%;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .conexao-status {
        text-align: center;
        padding: 10px;
        background: #ffc107;
        color: #000;
        font-weight: bold;
        display: none; /* Escondido por padrão, aparece se não estiver conectado */
    }

    @media(max-width: 700px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .campo.full {
            grid-column: auto;
        }

        table {
            font-size: 13px;
        }
        
        th, td {
            padding: 8px 5px;
        }
    }

    @media print {
        body * {
            visibility: hidden;
        }

        #impressao, #impressao * {
            visibility: visible;
        }

        #impressao {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            padding: 30px;
        }

        .nao-imprimir {
            display: none !important;
        }
    }
</style>
</head>

<body>

<div id="status-conexao" class="conexao-status nao-imprimir">Conectando ao banco de dados...</div>

<header class="nao-imprimir">
    <h1>Sistema de Chamados e Ordens de Serviço</h1>
    <p>Digitalização de manutenção com Cloud Storage</p>
</header>

<div class="container nao-imprimir">

    <div class="card">
        <h2>Cadastro do Chamado</h2>

        <form id="formulario" novalidate>

            <div class="grid">

                <div class="campo">
                    <label for="chamado">Nº do chamado *</label>
                    <input type="text" id="chamado" required>
                </div>

                <div class="campo">
                    <label for="os">Ordem de serviço</label>
                    <input type="text" id="os">
                </div>

                <div class="campo">
                    <label for="solicitante">Solicitante *</label>
                    <input type="text" id="solicitante" required>
                </div>

                <div class="campo">
                    <label for="setor">Setor</label>
                    <input type="text" id="setor">
                </div>

                <div class="campo">
                    <label for="bloco">Bloco</label>
                    <input type="text" id="bloco">
                </div>

                <div class="campo">
                    <label for="local">Local</label>
                    <input type="text" id="local">
                </div>

                <div class="campo full">
                    <label for="item">Item descritivo</label>
                    <input type="text" id="item">
                </div>

                <div class="campo full">
                    <label for="aparelho">Descrição do aparelho</label>
                    <textarea id="aparelho"></textarea>
                </div>

                <div class="campo">
                    <label for="evaporadora">Evaporadora</label>
                    <input type="text" id="evaporadora">
                </div>

                <div class="campo">
                    <label for="condensadora">Condensadora</label>
                    <input type="text" id="condensadora">
                </div>

                <div class="campo full">
                    <label for="defeito">Defeito relatado</label>
                    <textarea id="defeito"></textarea>
                </div>

                <div class="campo full">
                    <label for="solucao">Solução do defeito</label>
                    <textarea id="solucao"></textarea>
                </div>

                <div class="campo">
                    <label for="data">Data *</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label for="status">Status *</label>
                    <select id="status" required>
                        <option value="Em atendimento">Em atendimento</option>
                        <option value="Resolvido">Resolvido</option>
                        <option value="Fechado">Fechado</option>
                    </select>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" id="btn-salvar" class="salvar" disabled>
                    Salvar chamado
                </button>

                <button type="button" class="limpar" onclick="limparFormulario()">
                    Limpar
                </button>
            </div>

        </form>
    </div>

    <div class="card">
        <h2>Chamados cadastrados</h2>

        <input
            class="pesquisa"
            type="text"
            id="pesquisa"
            placeholder="Pesquisar por chamado, solicitante, setor ou local..."
            onkeyup="listarChamados()"
        >

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Chamado</th>
                        <th>OS</th>
                        <th>Solicitante</th>
                        <th>Setor</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Elemento para impressão (escondido na tela normal) -->
<div id="impressao"></div>

<!-- Modal Personalizado para substituir alert() e confirm() -->
<div id="custom-modal" class="modal-overlay nao-imprimir">
    <div class="modal-content">
        <h3 id="modal-title" style="margin-top: 0; color: #17365d;">Aviso</h3>
        <p id="modal-message"></p>
        <div class="modal-buttons">
            <button id="modal-btn-cancel" class="limpar" style="display: none;">Cancelar</button>
            <button id="modal-btn-confirm" class="salvar">OK</button>
        </div>
    </div>
</div>

<!-- Usando ES Modules para importar o Firebase e estruturar o JS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// =========================================================================
// ATENÇÃO: CONFIGURAÇÃO DO BANCO DE DADOS FIREBASE PARA O SEU SERVIDOR
// =========================================================================
let firebaseConfig;
let appId = 'sistema-de-chamados-app';

try {
    // Tenta usar as credenciais dinâmicas (Funciona aqui no ambiente de visualização do Canvas)
    firebaseConfig = JSON.parse(__firebase_config);
    if (typeof __app_id !== 'undefined') appId = __app_id;
} catch (e) {
    // PARA USAR NO SEU SERVIDOR:
    // 1. Acesse https://console.firebase.google.com/ e crie um projeto.
    // 2. Adicione um App Web no projeto.
    // 3. Ative o Firestore Database e a Autenticação (Anônima).
    // 4. Copie as chaves do firebaseConfig e substitua os valores abaixo:
    firebaseConfig = {
        apiKey: "COLE_SUA_API_KEY_AQUI",
        authDomain: "COLE_SEU_AUTH_DOMAIN_AQUI",
        projectId: "COLE_SEU_PROJECT_ID_AQUI",
        storageBucket: "COLE_SEU_STORAGE_BUCKET_AQUI",
        messagingSenderId: "COLE_SEU_MESSAGING_SENDER_ID",
        appId: "COLE_SEU_APP_ID"
    };
}
// =========================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Estado Global
let chamados = [];
let editandoId = null; // Agora usamos o ID do Firebase ao invés do index
let currentUser = null;

// --- Elementos HTML ---
const formulario = document.getElementById("formulario");
const btnSalvar = document.getElementById("btn-salvar");
const divStatusConexao = document.getElementById("status-conexao");
const inputChamado = document.getElementById("chamado");
const inputPesquisa = document.getElementById("pesquisa");

// --- Sistema de Modal Customizado ---
let modalConfirmCallback = null;

function showAlert(message) {
    document.getElementById("modal-title").innerText = "Aviso";
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-btn-cancel").style.display = "none";
    document.getElementById("custom-modal").style.display = "flex";
    modalConfirmCallback = null;
}

function showConfirm(message, callback) {
    document.getElementById("modal-title").innerText = "Confirmação";
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-btn-cancel").style.display = "inline-block";
    document.getElementById("custom-modal").style.display = "flex";
    modalConfirmCallback = callback;
}

document.getElementById("modal-btn-confirm").addEventListener("click", () => {
    document.getElementById("custom-modal").style.display = "none";
    if (modalConfirmCallback) modalConfirmCallback();
});

document.getElementById("modal-btn-cancel").addEventListener("click", () => {
    document.getElementById("custom-modal").style.display = "none";
    modalConfirmCallback = null;
});
// ------------------------------------

// Iniciar Autenticação Anônima (Necessário para segurança do Firebase)
const initAuth = async () => {
    divStatusConexao.style.display = "block";
    try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
        } else {
            await signInAnonymously(auth);
        }
    } catch (error) {
        console.error("Erro de autenticação:", error);
        divStatusConexao.innerText = "Erro ao conectar. Verifique as configurações do Firebase.";
        divStatusConexao.style.background = "#dc3545";
        divStatusConexao.style.color = "#fff";
    }
};

// Ouvinte de Estado da Autenticação
onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (!user) return; // Se não estiver logado, para por aqui.

    divStatusConexao.style.display = "none";
    btnSalvar.disabled = false; // Libera o botão de salvar

    // Conectar ao Banco de Dados e escutar mudanças em tempo real
    const chamadosRef = collection(db, 'artifacts', appId, 'public', 'data', 'chamados');
    
    onSnapshot(chamadosRef, (snapshot) => {
        chamados = [];
        snapshot.forEach((doc) => {
            chamados.push({ id: doc.id, ...doc.data() });
        });

        // Ordenar os chamados da data mais recente para a mais antiga
        chamados.sort((a, b) => new Date(b.data) - new Date(a.data));
        
        listarChamados();
    }, (error) => {
        console.error("Erro no Firestore:", error);
        showAlert("Erro ao tentar ler os chamados do servidor.");
    });
});

initAuth();

// Funções Auxiliares
function validarCampoTexto(idCampo, nomeExibicao) {
    const el = document.getElementById(idCampo);
    const valor = el ? el.value.trim() : "";
    if (!valor) {
        showAlert(`O campo "${nomeExibicao}" é obrigatório e não pode conter apenas espaços.`);
        if (el) el.focus();
        return false;
    }
    return true;
}

function validarFormulario() {
    if (!validarCampoTexto("chamado", "Nº do chamado")) return false;
    if (!validarCampoTexto("solicitante", "Solicitante")) return false;
    if (!validarCampoTexto("data", "Data")) return false;
    
    // Verificação de duplicidade no número do chamado (ignorando o item atual se estiver editando)
    const numChamado = inputChamado.value.trim();
    const existe = chamados.some(ch => ch.chamado === numChamado && ch.id !== editandoId);
    
    if (existe) {
        showAlert(`Já existe um chamado cadastrado com o número ${numChamado}. Por favor, insira um número diferente.`);
        inputChamado.focus();
        return false;
    }
    
    return true;
}

function formatarDataBR(dataString) {
    if (!dataString) return "";
    const partes = dataString.split("-");
    if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataString;
}

function obterClasseStatus(status) {
    if (status === "Em atendimento") return "status-em-atendimento";
    if (status === "Resolvido") return "status-resolvido";
    if (status === "Fechado") return "status-fechado";
    return "";
}

// Submissão do Formulário
formulario.addEventListener("submit", async function(event) {
    event.preventDefault();
    if (!currentUser) {
        showAlert("Você não está conectado ao banco de dados.");
        return;
    }
    if (!validarFormulario()) return;

    btnSalvar.disabled = true;
    btnSalvar.innerText = "Salvando...";

    const registro = {
        chamado: document.getElementById("chamado").value.trim(),
        os: document.getElementById("os").value.trim(),
        solicitante: document.getElementById("solicitante").value.trim(),
        setor: document.getElementById("setor").value.trim(),
        bloco: document.getElementById("bloco").value.trim(),
        local: document.getElementById("local").value.trim(),
        item: document.getElementById("item").value.trim(),
        aparelho: document.getElementById("aparelho").value.trim(),
        evaporadora: document.getElementById("evaporadora").value.trim(),
        condensadora: document.getElementById("condensadora").value.trim(),
        defeito: document.getElementById("defeito").value.trim(),
        solucao: document.getElementById("solucao").value.trim(),
        data: document.getElementById("data").value,
        status: document.getElementById("status").value
    };

    try {
        const chamadosRef = collection(db, 'artifacts', appId, 'public', 'data', 'chamados');
        
        if (editandoId !== null) {
            // Atualizar existente
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chamados', editandoId);
            await updateDoc(docRef, registro);
            showAlert("Chamado atualizado com sucesso!");
        } else {
            // Criar novo
            await addDoc(chamadosRef, registro);
            showAlert("Chamado salvo com sucesso!");
        }
        window.limparFormulario();
    } catch (error) {
        console.error("Erro ao salvar:", error);
        showAlert("Ocorreu um erro ao salvar o chamado.");
    } finally {
        btnSalvar.disabled = false;
        btnSalvar.innerText = "Salvar chamado";
    }
});

// Tornando funções acessíveis globalmente para os botões do HTML (pois estamos em module scope)
window.listarChamados = () => {
    const lista = document.getElementById("lista");
    const pesquisa = inputPesquisa.value.toLowerCase();
    lista.innerHTML = "";

    chamados.forEach((item) => {
        const statusAtual = item.status || "Em atendimento"; 
        const texto = `
            ${item.chamado}
            ${item.solicitante}
            ${item.setor}
            ${item.local}
            ${statusAtual}
        `.toLowerCase();

        if (!texto.includes(pesquisa)) return;

        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${item.chamado}</td>
            <td>${item.os}</td>
            <td>${item.solicitante}</td>
            <td>${item.setor}</td>
            <td>${item.local}</td>
            <td>${formatarDataBR(item.data)}</td>
            <td>
                <span class="status-badge ${obterClasseStatus(statusAtual)}">
                    ${statusAtual}
                </span>
            </td>
            <td>
                <div class="acoes">
                    <button class="editar" onclick="window.editarChamado('${item.id}')">
                        Editar
                    </button>
                    <button class="excluir" onclick="window.excluirChamado('${item.id}')">
                        Excluir
                    </button>
                    <button class="imprimir" onclick="window.imprimirChamado('${item.id}')">
                        Imprimir
                    </button>
                </div>
            </td>
        `;
        lista.appendChild(linha);
    });
};

window.editarChamado = (id) => {
    const item = chamados.find(ch => ch.id === id);
    if(!item) return;

    document.getElementById("chamado").value = item.chamado;
    document.getElementById("os").value = item.os;
    document.getElementById("solicitante").value = item.solicitante;
    document.getElementById("setor").value = item.setor;
    document.getElementById("bloco").value = item.bloco;
    document.getElementById("local").value = item.local;
    document.getElementById("item").value = item.item;
    document.getElementById("aparelho").value = item.aparelho || "";
    document.getElementById("evaporadora").value = item.evaporadora || "";
    document.getElementById("condensadora").value = item.condensadora || "";
    document.getElementById("defeito").value = item.defeito || "";
    document.getElementById("solucao").value = item.solucao || "";
    document.getElementById("data").value = item.data;
    document.getElementById("status").value = item.status || "Em atendimento";

    editandoId = id; // Guarda o ID do banco
    window.scrollTo({ top: 0, behavior: "smooth" });
};

window.excluirChamado = (id) => {
    showConfirm("Deseja realmente excluir este chamado?", async () => {
        try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chamados', id);
            await deleteDoc(docRef);
            showAlert("Chamado excluído com sucesso!");
        } catch (error) {
            console.error("Erro ao excluir", error);
            showAlert("Erro ao tentar excluir o chamado.");
        }
    });
};

window.limparFormulario = () => {
    formulario.reset();
    editandoId = null;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
    document.getElementById("status").value = "Em atendimento";
};

window.imprimirChamado = (id) => {
    const item = chamados.find(ch => ch.id === id);
    if(!item) return;

    const statusAtual = item.status || "Em atendimento";

    document.getElementById("impressao").innerHTML = `
        <h1>ORDEM DE SERVIÇO</h1>
        <hr>
        <h3>Identificação</h3>
        <p><strong>Nº do chamado:</strong> ${item.chamado}</p>
        <p><strong>Ordem de serviço:</strong> ${item.os}</p>
        <p><strong>Data:</strong> ${formatarDataBR(item.data)}</p>
        <p><strong>Status Atual:</strong> ${statusAtual}</p>
        
        <h3>Solicitação</h3>
        <p><strong>Solicitante:</strong> ${item.solicitante}</p>
        <p><strong>Setor:</strong> ${item.setor}</p>
        <p><strong>Bloco:</strong> ${item.bloco}</p>
        <p><strong>Local:</strong> ${item.local}</p>
        <p><strong>Item descritivo:</strong> ${item.item}</p>
        
        <h3>Equipamento</h3>
        <p><strong>Descrição do aparelho:</strong><br>${item.aparelho || "Não informado"}</p>
        <p><strong>Evaporadora:</strong> ${item.evaporadora || "Não informado"}</p>
        <p><strong>Condensadora:</strong> ${item.condensadora || "Não informado"}</p>
        
        <h3>Manutenção</h3>
        <p><strong>Defeito relatado:</strong><br>${item.defeito || "Não informado"}</p>
        <p><strong>Solução do defeito:</strong><br>${item.solucao || "Não informado"}</p>
        <br><br>
        <p>________________________________________</p>
        <p>Responsável pela execução</p>
        <br>
        <p>________________________________________</p>
        <p>Responsável pelo recebimento</p>
    `;

    window.print();
};

window.limparFormulario();

// Garante que o input de pesquisa dispare a função global
inputPesquisa.addEventListener("keyup", window.listarChamados);

</script>
</body>
</html>
